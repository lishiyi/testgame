<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔改贪吃蛇 · 道具与关卡障碍版</title>
  <meta name="description" content="带有金色苹果、寒冰减速、穿墙碎石护盾与动态关卡岩石障碍的进阶版贪吃蛇小游戏。" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <main class="game-shell" aria-label="贪吃蛇游戏主界面">
    <header class="game-header">
      <div class="brand-group">
        <h1>经典贪吃蛇 · 进阶版</h1>
        <p class="brand-subtitle">善用随机道具，突破不断升级的岩石关卡</p>
      </div>
      <div class="header-actions">
        <button id="pause-btn" class="icon-btn" type="button" disabled aria-label="暂停或继续游戏">暂停</button>
        <button id="mute-btn" class="icon-btn" type="button" aria-label="切换音效开关">音效: 开</button>
      </div>
    </header>

    <section class="stats-bar" aria-label="游戏计分板">
      <div class="stat-item">
        <span class="stat-label">当前得分</span>
        <span id="score-value" class="stat-value accent">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">当前关卡</span>
        <span id="level-value" class="stat-value">Lv.1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">最高纪录</span>
        <span id="best-score-value" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">移动速度</span>
        <span id="speed-value" class="stat-value">1.0x</span>
      </div>
    </section>

    <section class="item-legend" aria-label="道具与机制图鉴">
      <span class="legend-chip"><i class="dot dot-gold"></i>金果 +30分</span>
      <span class="legend-chip"><i class="dot dot-ice"></i>寒冰减速</span>
      <span class="legend-chip"><i class="dot dot-shield"></i>护盾穿墙碎石</span>
      <span class="legend-chip"><i class="dot dot-rock"></i>岩石障碍</span>
    </section>

    <section class="board-stage" aria-label="游戏画布区域">
      <canvas id="game-canvas" width="400" height="400"></canvas>

      <div id="buff-bar" class="buff-bar" aria-live="polite"></div>

      <div id="level-banner" class="level-banner hidden" aria-live="polite">关卡提升！注意新障碍预警</div>

      <div id="board-overlay" class="board-overlay">
        <h2 id="overlay-title" class="overlay-title">准备出发</h2>
        <p id="overlay-desc" class="overlay-desc">每满 50 分升级关卡并刷新岩石障碍；拾取护盾可穿墙并撞碎岩石！</p>
        <button id="start-btn" class="primary-btn" type="button">开始游戏</button>
      </div>
    </section>

    <footer class="controls-section">
      <div class="keyboard-hints">
        <span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 转向</span>
        <span><kbd>Space</kbd> 暂停 / 继续 · <kbd>Enter</kbd> 快速开始</span>
      </div>

      <div class="dpad" role="group" aria-label="方向控制键">
        <button id="dpad-up" class="dpad-btn" type="button" aria-label="向上">▲</button>
        <button id="dpad-left" class="dpad-btn" type="button" aria-label="向左">◀</button>
        <button id="dpad-down" class="dpad-btn" type="button" aria-label="向下">▼</button>
        <button id="dpad-right" class="dpad-btn" type="button" aria-label="向右">▶</button>
      </div>
    </footer>
  </main>

  <script src="./game.js"></script>
</body>
</html>
